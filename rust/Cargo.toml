[workspace]
resolver = "2"
members = ["crates/triangle", "crates/triangle-io", "crates/triangle-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Stage 1 pins zero unsafe code (ADR 0002, ADR 0004 section 6): forbid, not
# deny, so no module can re-enable it by accident. A later rung-gated unsafe
# change (bounds-check elision inside the chokepoints only) relaxes this line
# in its own PR, together with a docs/deviation-register.md entry.
[workspace.lints.rust]
unsafe_code = "forbid"

# R1 fix 4: fat LTO for the release profile. Measured effect on the
# benchmark box (see the PR): the m+l aggregate candidate total drops
# ~5-7% vs the default profile and the candidate aggregate runs faster
# than the oracle; codegen-units/strip/panic/opt-level variants showed
# no measurable additional effect. Byte parity is unaffected (120/120).
[profile.release]
lto = "fat"

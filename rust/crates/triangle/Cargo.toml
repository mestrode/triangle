[package]
name = "triangle"
description = "Rust port of Triangle (Shewchuk's Triangle 1.6 + aCute refinement), verified byte-identical against the pinned C oracle"
version.workspace = true
edition.workspace = true
# Zero dependencies on day one (ADR 0004); adding one needs its own
# ticket. The single exception is the interchange-crate extraction
# (issue #70, ADR 0006): the triangle-io path dependency owns the six
# Triangle interchange file formats over neutral types, and the
# direction is triangle -> triangle-io only.

[dependencies]
triangle-io = { path = "../triangle-io" }

[features]
default = ["acute"]
# aCute refinement (the -U max-angle family). The mirror of the C NO_ACUTE
# compile switch, inverted: C builds WITH aCute unless NO_ACUTE is defined;
# this crate builds with the acute feature unless --no-default-features.
acute = []

[lints]
workspace = true

# The R3 rung-boundary measurement instrument (issue #57, PART A):
# benches/corpus.rs, one criterion bench per timed corpus workload.
# A measurement instrument, never a CI job; it drives the public API
# only and does not touch the library. Criterion is pinned exact so
# every protocol run (baseline, noise, drift, candidate) resolves the
# identical measurement code; serde/serde_json parse the corpus
# manifest and are already criterion's own transitive dependencies,
# so the dependency tree does not grow beyond criterion itself.
# default-features stay off (no rayon, no plotting): the suite is
# single-threaded on purpose and the measurement box has 2 vCPUs.
[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The rung-boundary instrument: one bench per timed corpus workload
# (the m+l timed set of run-bench.sh, 80 benches).
[[bench]]
name = "corpus"
harness = false

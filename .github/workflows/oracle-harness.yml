# Oracle harness: self-check now, permanent serial byte-identity gate later.
#
# Wayfinder ticket #13. Until the Rust port's CLI exists (stage 1 + I/O +
# CLI phases), this job keeps the differential harness itself green: it
# builds the pinned C oracle, regenerates the corpus, verifies oracle
# self-determinism over the corpus, and re-validates detection/localization
# against the injected-divergence stub.
#
# Once the Rust CLI lands, switch this job to the differential run:
#   tools/oracle/run-harness.sh --candidate <path-to-built-rust-cli>
# That job is then the permanent serial-path byte-identity gate required by
# ADR docs/adr/0001-port-strategy.md (serial byte-identity stays binding,
# including when internal multithreading lands).
name: oracle-harness

on:
  push:
    branches: [master]
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned oracle build + corpus + harness self-check
        run: tools/oracle/run-harness.sh
